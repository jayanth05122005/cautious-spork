<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - TradeMaster Pro</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="auth-container">
      <div class="auth-background">
        <div class="floating-elements">
          <div class="floating-element elem-1">
            <i class="fas fa-chart-line"></i>
          </div>
          <div class="floating-element elem-2">
            <i class="fas fa-coins"></i>
          </div>
          <div class="floating-element elem-3">
            <i class="fas fa-rocket"></i>
          </div>
          <div class="floating-element elem-4">
            <i class="fas fa-shield-alt"></i>
          </div>
        </div>
        <div class="auth-gradient"></div>
      </div>

      <div class="auth-form-container">
        <div class="auth-header">
          <a href="index.html" class="auth-logo">
            <i class="fas fa-chart-line"></i>
            <span>TradeMaster Pro</span>
          </a>
          <p class="auth-subtitle">
            Welcome back! Please sign in to your account.
          </p>
        </div>

        <form class="auth-form" id="loginForm">
          <div class="form-group">
            <label for="email">Email Address</label>
            <div class="input-group">
              <i class="fas fa-envelope"></i>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <div class="input-group">
              <i class="fas fa-lock"></i>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
              />
              <button type="button" class="password-toggle" id="togglePassword">
                <i class="fas fa-eye"></i>
              </button>
            </div>
          </div>

          <div class="form-options">
            <label class="checkbox-container">
              <input type="checkbox" name="remember" id="remember" />
              <span class="checkmark"></span>
              Remember me
            </label>
            <a href="#" class="forgot-password">Forgot Password?</a>
          </div>

          <button type="submit" class="auth-button primary">
            <i class="fas fa-sign-in-alt"></i>
            Sign In
          </button>

          <div class="auth-divider">
            <span>or continue with</span>
          </div>

          <div class="social-login">
            <button type="button" class="social-button google">
              <i class="fab fa-google"></i>
              Google
            </button>
            <button type="button" class="social-button github">
              <i class="fab fa-github"></i>
              GitHub
            </button>
          </div>

          <p class="auth-footer">
            Don't have an account?
            <a href="get-started.html" class="auth-link">Get Started</a>
          </p>
        </form>
      </div>
    </div>

    <script>
      // Password toggle functionality
      const togglePassword = document.getElementById("togglePassword");
      const passwordInput = document.getElementById("password");

      togglePassword.addEventListener("click", function () {
        const type =
          passwordInput.getAttribute("type") === "password"
            ? "text"
            : "password";
        passwordInput.setAttribute("type", type);

        const icon = this.querySelector("i");
        icon.className =
          type === "password" ? "fas fa-eye" : "fas fa-eye-slash";
      });

      // Form validation and submission
      const loginForm = document.getElementById("loginForm");

      loginForm.addEventListener("submit", function (e) {
        e.preventDefault();

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        // Basic validation
        if (!email || !password) {
          showMessage("Please fill in all fields", "error");
          return;
        }

        if (!isValidEmail(email)) {
          showMessage("Please enter a valid email address", "error");
          return;
        }

        // Simulate login process
        showMessage("Signing you in...", "info");

        setTimeout(() => {
          showMessage("Login successful! Redirecting...", "success");
          setTimeout(() => {
            window.location.href = "index.html";
          }, 1000);
        }, 1500);
      });

      function isValidEmail(email) {
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        return emailRegex.test(email);
      }

      function showMessage(message, type) {
        // Remove existing message
        const existingMessage = document.querySelector(".auth-message");
        if (existingMessage) {
          existingMessage.remove();
        }

        // Create new message
        const messageDiv = document.createElement("div");
        messageDiv.className = `auth-message ${type}`;
        messageDiv.innerHTML = `<i class="fas fa-${
          type === "success"
            ? "check-circle"
            : type === "error"
            ? "exclamation-circle"
            : "info-circle"
        }"></i> ${message}`;

        const form = document.querySelector(".auth-form");
        form.insertBefore(messageDiv, form.firstChild);

        // Auto remove after 5 seconds
        setTimeout(() => {
          if (messageDiv.parentNode) {
            messageDiv.remove();
          }
        }, 5000);
      }
    </script>
  </body>
</html>
