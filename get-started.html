<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Get Started - TradeMaster Pro</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="auth-container">
      <div class="auth-background">
        <div class="floating-elements">
          <div class="floating-element elem-1">
            <i class="fas fa-chart-line"></i>
          </div>
          <div class="floating-element elem-2">
            <i class="fas fa-coins"></i>
          </div>
          <div class="floating-element elem-3">
            <i class="fas fa-rocket"></i>
          </div>
          <div class="floating-element elem-4">
            <i class="fas fa-shield-alt"></i>
          </div>
          <div class="floating-element elem-5">
            <i class="fas fa-users"></i>
          </div>
        </div>
        <div class="auth-gradient"></div>
      </div>

      <div class="auth-form-container">
        <div class="auth-header">
          <a href="index.html" class="auth-logo">
            <i class="fas fa-chart-line"></i>
            <span>TradeMaster Pro</span>
          </a>
          <p class="auth-subtitle">
            Start your trading journey today. Join thousands of successful
            traders.
          </p>
        </div>

        <form class="auth-form" id="signupForm">
          <div class="form-row">
            <div class="form-group">
              <label for="firstName">First Name</label>
              <div class="input-group">
                <i class="fas fa-user"></i>
                <input
                  type="text"
                  id="firstName"
                  name="firstName"
                  placeholder="John"
                  required
                />
              </div>
            </div>
            <div class="form-group">
              <label for="lastName">Last Name</label>
              <div class="input-group">
                <i class="fas fa-user"></i>
                <input
                  type="text"
                  id="lastName"
                  name="lastName"
                  placeholder="Doe"
                  required
                />
              </div>
            </div>
          </div>

          <div class="form-group">
            <label for="signupEmail">Email Address</label>
            <div class="input-group">
              <i class="fas fa-envelope"></i>
              <input
                type="email"
                id="signupEmail"
                name="email"
                placeholder="john.doe@example.com"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label for="signupPassword">Password</label>
            <div class="input-group">
              <i class="fas fa-lock"></i>
              <input
                type="password"
                id="signupPassword"
                name="password"
                placeholder="Create a strong password"
                required
              />
              <button
                type="button"
                class="password-toggle"
                id="toggleSignupPassword"
              >
                <i class="fas fa-eye"></i>
              </button>
            </div>
            <div class="password-strength">
              <div class="strength-meter">
                <div class="strength-bar" id="strengthBar"></div>
              </div>
              <span class="strength-text" id="strengthText"
                >Password strength</span
              >
            </div>
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <div class="input-group">
              <i class="fas fa-lock"></i>
              <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                placeholder="Confirm your password"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label for="experience">Trading Experience</label>
            <div class="input-group">
              <i class="fas fa-chart-line"></i>
              <select id="experience" name="experience" required>
                <option value="">Select your experience level</option>
                <option value="beginner">Beginner (New to trading)</option>
                <option value="intermediate">Intermediate (1-3 years)</option>
                <option value="advanced">Advanced (3+ years)</option>
                <option value="professional">Professional Trader</option>
              </select>
            </div>
          </div>

          <div class="form-options">
            <label class="checkbox-container">
              <input type="checkbox" name="terms" id="terms" required />
              <span class="checkmark"></span>
              I agree to the <a href="#" class="link">Terms of Service</a> and
              <a href="#" class="link">Privacy Policy</a>
            </label>
          </div>

          <div class="form-options">
            <label class="checkbox-container">
              <input type="checkbox" name="newsletter" id="newsletter" />
              <span class="checkmark"></span>
              Subscribe to our newsletter for trading tips and market insights
            </label>
          </div>

          <button type="submit" class="auth-button primary">
            <i class="fas fa-user-plus"></i>
            Create Account
          </button>

          <div class="auth-divider">
            <span>or sign up with</span>
          </div>

          <div class="social-login">
            <button type="button" class="social-button google">
              <i class="fab fa-google"></i>
              Google
            </button>
            <button type="button" class="social-button github">
              <i class="fab fa-github"></i>
              GitHub
            </button>
          </div>

          <p class="auth-footer">
            Already have an account?
            <a href="login.html" class="auth-link">Sign In</a>
          </p>
        </form>
      </div>
    </div>

    <script>
      // Password toggle functionality
      const togglePassword = document.getElementById("toggleSignupPassword");
      const passwordInput = document.getElementById("signupPassword");

      togglePassword.addEventListener("click", function () {
        const type =
          passwordInput.getAttribute("type") === "password"
            ? "text"
            : "password";
        passwordInput.setAttribute("type", type);

        const icon = this.querySelector("i");
        icon.className =
          type === "password" ? "fas fa-eye" : "fas fa-eye-slash";
      });

      // Password strength checker
      passwordInput.addEventListener("input", function () {
        const password = this.value;
        const strength = checkPasswordStrength(password);
        updatePasswordStrength(strength);
      });

      function checkPasswordStrength(password) {
        let strength = 0;

        if (password.length >= 8) strength++;
        if (/[a-z]/.test(password)) strength++;
        if (/[A-Z]/.test(password)) strength++;
        if (/[0-9]/.test(password)) strength++;
        if (/[^A-Za-z0-9]/.test(password)) strength++;

        return strength;
      }

      function updatePasswordStrength(strength) {
        const strengthBar = document.getElementById("strengthBar");
        const strengthText = document.getElementById("strengthText");

        const colors = ["#ef4444", "#f59e0b", "#eab308", "#84cc16", "#22c55e"];
        const texts = ["Very Weak", "Weak", "Fair", "Good", "Strong"];

        const percentage = (strength / 5) * 100;
        strengthBar.style.width = percentage + "%";
        strengthBar.style.backgroundColor = colors[strength - 1] || colors[0];

        strengthText.textContent =
          strength > 0 ? texts[strength - 1] : "Password strength";
        strengthText.style.color = colors[strength - 1] || "#94a3b8";
      }

      // Form validation and submission
      const signupForm = document.getElementById("signupForm");

      signupForm.addEventListener("submit", function (e) {
        e.preventDefault();

        const firstName = document.getElementById("firstName").value;
        const lastName = document.getElementById("lastName").value;
        const email = document.getElementById("signupEmail").value;
        const password = document.getElementById("signupPassword").value;
        const confirmPassword =
          document.getElementById("confirmPassword").value;
        const experience = document.getElementById("experience").value;
        const terms = document.getElementById("terms").checked;

        // Validation
        if (
          !firstName ||
          !lastName ||
          !email ||
          !password ||
          !confirmPassword ||
          !experience
        ) {
          showMessage("Please fill in all required fields", "error");
          return;
        }

        if (!isValidEmail(email)) {
          showMessage("Please enter a valid email address", "error");
          return;
        }

        if (password !== confirmPassword) {
          showMessage("Passwords do not match", "error");
          return;
        }

        if (password.length < 8) {
          showMessage("Password must be at least 8 characters long", "error");
          return;
        }

        if (!terms) {
          showMessage(
            "Please accept the Terms of Service and Privacy Policy",
            "error"
          );
          return;
        }

        // Simulate signup process
        showMessage("Creating your account...", "info");

        setTimeout(() => {
          showMessage(
            "Account created successfully! Redirecting to login...",
            "success"
          );
          setTimeout(() => {
            window.location.href = "login.html";
          }, 1000);
        }, 2000);
      });

      function isValidEmail(email) {
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        return emailRegex.test(email);
      }

      function showMessage(message, type) {
        // Remove existing message
        const existingMessage = document.querySelector(".auth-message");
        if (existingMessage) {
          existingMessage.remove();
        }

        // Create new message
        const messageDiv = document.createElement("div");
        messageDiv.className = `auth-message ${type}`;
        messageDiv.innerHTML = `<i class="fas fa-${
          type === "success"
            ? "check-circle"
            : type === "error"
            ? "exclamation-circle"
            : "info-circle"
        }"></i> ${message}`;

        const form = document.querySelector(".auth-form");
        form.insertBefore(messageDiv, form.firstChild);

        // Auto remove after 5 seconds
        setTimeout(() => {
          if (messageDiv.parentNode) {
            messageDiv.remove();
          }
        }, 5000);
      }
    </script>
  </body>
</html>
